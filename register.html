<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - VHD STORE</title>
    <link rel="stylesheet" href="css_for3/style.css">
</head>
<body class="auth-page">

<div class="auth-container">

    <div class="auth-info">
        <a href="index.html" class="logo">VHD<span>STORE</span></a>
        <h1>Chào mừng bạn!</h1>
        <p>
            Đăng ký tài khoản để trải nghiệm mua sắm
            văn phòng phẩm tiện lợi và nhanh chóng.
        </p>
        <div class="auth-illustration">📚 ✏️ 🖊️</div>
    </div>

    <div class="auth-form">
        <a href="index.html" class="back-home">← Trang chủ</a>

        <h2>Tạo tài khoản</h2>
        <p class="form-desc">Điền thông tin để đăng ký thành viên.</p>

        <form id="registerForm">

            <label>Họ và tên</label>
            <input type="text" id="fullname"
                   placeholder="Nhập họ và tên" required>

            <label>Email</label>
            <input type="email" id="registerEmail"
                   placeholder="example@gmail.com" required>

            <label>Số điện thoại</label>
            <input type="tel" id="phone"
                   placeholder="Nhập số điện thoại"
                   pattern="[0-9]{10}" required>

            <label>Mật khẩu</label>
            <input type="password" id="registerPassword"
                   placeholder="Ít nhất 8 ký tự" minlength="8" required>

            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword"
                   placeholder="Nhập lại mật khẩu" required>

            <div class="form-check">
                <input type="checkbox" id="agree" required>
                <label for="agree">
                    Tôi đồng ý với điều khoản sử dụng.
                </label>
            </div>

            <button type="submit" class="btn-submit">
                Đăng ký ngay
            </button>

        </form>

        <p class="switch-auth">
            Đã có tài khoản?
            <a href="login.html">Đăng nhập</a>
        </p>
    </div>

</div>

<script src="js/auth.js"></script>
</body>
</html>
